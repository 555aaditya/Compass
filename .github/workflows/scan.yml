# Scheduled scan + notify without your computer. Resume tailoring stays local (needs your master resume + a Claude session).
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, QUANT_JOURNAL_TOKEN (fine-grained PAT, read-only Contents on Quant-Journal).
# Untested: see docs/IMPLEMENTATION_STATUS.md.
name: scan
on:
  schedule: [{ cron: "30 3,15 * * *" }]   # 09:00 and 21:00 IST
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_PATH: ${{ github.workspace }}/quant-journal/V2.0/10-Resume-Wiki
      AUTO_GENERATE_RESUMES: "false"
      SCHEDULER_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4          # PRIVATE wiki: needs a fine-grained PAT (Contents: read) in QUANT_JOURNAL_TOKEN
        with: { repository: 555aaditya/Quant-Journal, path: quant-journal, token: "${{ secrets.QUANT_JOURNAL_TOKEN }}" }
      - name: "Restore state (Actions cache, private to this repo)"
        uses: actions/cache/restore@v4
        with: { path: data/compass.db, key: state-never-matches, restore-keys: "state-" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m app.cli sync > /dev/null && python -m app.cli scan   # sync output hidden: logs are public
      - name: Build read-only jobs page (jobs only; no profile, resumes or notes)
        run: cd backend && python -m app.cli snapshot --out ../site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
        continue-on-error: true   # needs Settings > Pages > Source: GitHub Actions. The page is PUBLIC; see docs/SETUP.md
      - name: Save state
        uses: actions/cache/save@v4
        with: { path: data/compass.db, key: "state-${{ github.run_id }}" }
